<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat - Supabase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white font-sans flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-gray-800 shadow-md p-4 flex justify-between items-center z-10">
        <h1 class="text-xl font-bold">Global Chat 🌍</h1>
        <div class="text-sm text-green-400 flex items-center gap-2">
            <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
            Live
        </div>
    </header>

    <!-- Chat Messages Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col">
        <div id="loading-text" class="text-center text-gray-400 text-sm mt-10">
            Loading messages...
        </div>
    </main>

    <!-- Input Form -->
    <footer class="bg-gray-800 p-4 shadow-inner">
        <form id="chat-form" class="flex flex-col sm:flex-row gap-2 max-w-5xl mx-auto">
            <input type="text" id="username-input" placeholder="Your name" required
                   class="sm:w-1/4 bg-gray-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-400">
            
            <input type="text" id="message-input" placeholder="Type a message..." required autocomplete="off"
                   class="flex-1 bg-gray-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-400">
            
            <button type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 transition px-8 py-3 rounded-lg font-semibold shadow-lg">
                Send
            </button>
        </form>
    </footer>

    <script>
        // ==========================================
        // 1. ADD YOUR SUPABASE CREDENTIALS HERE
        // ==========================================
        // Make sure to keep the quotation marks!
        const SUPABASE_URL = 'https://gjeylfesordhyprgccni.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZXlsZmVzb3JkaHlwcmdjY25pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MjA2NDQsImV4cCI6MjEwNDk5NjY0NH0._VrCKq9ByTdeU9Y3AcCtFODbWGcVDMQ-szRy3ZPIQuE';
        
        const client = supabase.createClient(https://gjeylfesordhyprgccni.supabase.co/rest/v1/, eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZXlsZmVzb3JkaHlwcmdjY25pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MjA2NDQsImV4cCI6MjEwNDk5NjY0NH0._VrCKq9ByTdeU9Y3AcCtFODbWGcVDMQ-szRy3ZPIQuE);

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const loadingText = document.getElementById('loading-text');
        const chatForm = document.getElementById('chat-form');
        const usernameInput = document.getElementById('username-input');
        const messageInput = document.getElementById('message-input');

        let isFirstLoad = true;

        // ==========================================
        // 2. PERSIST USERNAME
        // ==========================================
        // If they already set a username previously, load it automatically
        if (localStorage.getItem('chat_username')) {
            usernameInput.value = localStorage.getItem('chat_username');
        }

        // ==========================================
        // 3. FETCH PREVIOUS MESSAGES
        // ==========================================
        async function loadInitialMessages() {
            // Check if the user forgot to change the placeholder keys
            if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                showError("You forgot to replace the Supabase URL and Anon Key in the code!");
                return;
            }

            const { data, error } = await client
                .from('messages')
                .select('*')
                .order('created_at', { ascending: false }) 
                .limit(50); 

            if (error) {
                console.error(error);
                showError("Database Error: " + error.message + " <br><br>(Did you run the SQL script to create the table and disable RLS?)");
                return;
            }

            if (loadingText) loadingText.remove(); // Clear loading text
            
            const sortedMessages = data.reverse();
            sortedMessages.forEach(displayMessage);
            scrollToBottom();
            isFirstLoad = false;
        }

        // ==========================================
        // 4. LISTEN FOR NEW MESSAGES IN REAL-TIME
        // ==========================================
        function setupRealtimeSubscription() {
            client
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    displayMessage(payload.new);
                    scrollToBottom();
                })
                .subscribe();
        }

        // ==========================================
        // 5. SEND A NEW MESSAGE
        // ==========================================
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const content = messageInput.value.trim();
            if (!username || !content) return;

            // Save the username to local storage so it never resets
            localStorage.setItem('chat_username', username);

            // Clear the message input, but keep the username intact
            messageInput.value = '';
            messageInput.focus();

            const { error } = await client
                .from('messages')
                .insert([{ username, content }]);

            if (error) {
                console.error('Error sending message:', error);
                alert('Failed to send message: ' + error.message);
            }
        });

        // ==========================================
        // 6. HELPER FUNCTIONS
        // ==========================================
        function displayMessage(msg) {
            const currentUsername = usernameInput.value.trim() || localStorage.getItem('chat_username');
            const isMe = msg.username === currentUsername;
            
            const msgWrapper = document.createElement('div');
            msgWrapper.className = `flex flex-col max-w-[80%] ${isMe ? 'self-end items-end' : 'self-start items-start'} animate-fade-in-up`;
            
            const header = document.createElement('span');
            header.className = 'text-xs text-gray-400 mb-1 px-1 font-medium tracking-wide';
            header.textContent = msg.username;
            
            const bubble = document.createElement('div');
            bubble.className = `px-4 py-2.5 rounded-2xl text-sm md:text-base shadow-sm break-words ${
                isMe 
                ? 'bg-indigo-600 text-white rounded-br-sm' 
                : 'bg-gray-700 text-gray-100 rounded-bl-sm'
            }`;
            bubble.textContent = msg.content;
            
            msgWrapper.appendChild(header);
            msgWrapper.appendChild(bubble);
            
            if (isFirstLoad) {
                msgWrapper.classList.remove('animate-fade-in-up');
            }

            chatContainer.appendChild(msgWrapper);
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showError(msg) {
            if (loadingText) loadingText.remove();
            chatContainer.innerHTML = `<div class="bg-red-900/50 border border-red-500 text-red-200 p-4 rounded-lg max-w-2xl mx-auto mt-10 shadow-lg text-center font-mono text-sm">${msg}</div>`;
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in-up {
                animation: fadeInUp 0.3s ease-out forwards;
            }
        `;
        document.head.appendChild(style);

        // Start the app
        loadInitialMessages();
        setupRealtimeSubscription();
    </script>
</body>
</html>
